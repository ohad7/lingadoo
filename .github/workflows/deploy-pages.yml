name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run node tests
        run: node --test tests/node/*.test.mjs

      - name: Build
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GA_REQUIRE_CONSENT: ${{ vars.VITE_GA_REQUIRE_CONSENT }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}

      - name: Add SPA fallback page
        run: cp dist/index.html dist/404.html

      - name: Configure custom domain
        if: ${{ vars.PAGES_CUSTOM_DOMAIN != '' }}
        run: printf '%s\n' "$PAGES_CUSTOM_DOMAIN" > dist/CNAME
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
